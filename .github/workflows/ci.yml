name: Verify MCAI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm ci --prefix local-cloud
      - run: npm run check --prefix local-cloud
      - run: npm run test --prefix local-cloud
      - run: go test ./...
        working-directory: apps/agent
